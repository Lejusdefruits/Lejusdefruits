<svg viewBox="0 0 900 300" width="900" height="300" xmlns="http://www.w3.org/2000/svg" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif">
  <style>
    :root{
      --bg1:#FFF3D6; --bg2:#FFD98C; --deco:#FF8C1A;
      --ink:#7A3E00; --ink-soft:#B5651D;
      --glass-stroke:#C98A3C; --glass-fill:#FFFFFF;
      --juice-top:#FFC24D; --juice-bot:#FF7A00;
      --bubble:#FFFFFF; --leaf:#3FA34D; --accent:#FF6B00;
    }
    .title{ font-size:62px; font-weight:bold; letter-spacing:1px; fill:var(--ink); }
    .titleShadow{ font-size:62px; font-weight:bold; letter-spacing:1px; fill:var(--accent); opacity:.25; }
    .tagline{ font-size:23px; font-weight:bold; fill:var(--ink-soft); }
    .sub{ font-size:16px; fill:var(--ink-soft); opacity:.9; }

    #juice{ animation: fill 7s ease-in-out infinite; }
    @keyframes fill{
      0%{ transform:translateY(150px); }
      35%{ transform:translateY(10px); }
      62%{ transform:translateY(24px); }
      100%{ transform:translateY(150px); }
    }
    .wave{ animation: drift 4s linear infinite; }
    .wave2{ animation: drift 5.5s linear infinite reverse; }
    @keyframes drift{ from{ transform:translateX(0); } to{ transform:translateX(-60px); } }

    .b{ animation: rise 3.2s ease-in infinite; }
    .b2{ animation: rise 4.1s ease-in infinite; }
    .b3{ animation: rise 2.6s ease-in .6s infinite; }
    .b4{ animation: rise 3.7s ease-in 1.1s infinite; }
    .b5{ animation: rise 4.6s ease-in .3s infinite; }
    @keyframes rise{
      0%{ transform:translateY(0); opacity:0; }
      15%{ opacity:.85; }
      85%{ opacity:.6; }
      100%{ transform:translateY(-115px); opacity:0; }
    }
    @media (prefers-reduced-motion: reduce){
      #juice,.wave,.wave2,.b,.b2,.b3,.b4,.b5{ animation:none; }
      #juice{ transform:translateY(18px); }
    }
  </style>

  <!-- fond -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg1)"/>
      <stop offset="1" stop-color="var(--bg2)"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--juice-top)"/>
      <stop offset="1" stop-color="var(--juice-bot)"/>
    </linearGradient>
    <clipPath id="glassInner">
      <path d="M582 90 L738 90 L710 244 L610 244 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="300" rx="24" fill="url(#bg)"/>

  <!-- tranches d'agrumes en filigrane -->
  <g opacity="0.10" fill="var(--deco)">
    <circle cx="120" cy="250" r="90"/>
    <circle cx="830" cy="40" r="70"/>
  </g>
  <g opacity="0.07" stroke="var(--deco)" stroke-width="3" fill="none">
    <circle cx="120" cy="250" r="60"/>
    <circle cx="830" cy="40" r="46"/>
  </g>

  <!-- texte -->
  <text class="titleShadow" x="62" y="142">Lejusdefruits</text>
  <text class="title" x="60" y="140">Lejusdefruits</text>
  <text class="tagline" x="62" y="180">Je presse des idées, ça sort en code.</text>
  <text class="sub" x="63" y="212">développeur curieux · pressé à froid · 100% sans bug ajouté</text>

  <!-- paille -->
  <g transform="rotate(-18 705 90)">
    <rect x="697" y="40" width="16" height="200" rx="8" fill="var(--accent)"/>
    <rect x="700" y="44" width="3" height="192" rx="2" fill="var(--bubble)" opacity="0.4"/>
  </g>

  <!-- liquide (clippé par l'intérieur du verre) -->
  <g clip-path="url(#glassInner)">
    <g id="juice">
      <rect x="575" y="96" width="170" height="200" fill="url(#liquid)"/>
      <path class="wave" d="M555 98 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 v40 h-240 Z" fill="var(--juice-top)" opacity="0.7"/>
      <path class="wave2" d="M555 100 q15 8 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 v40 h-240 Z" fill="var(--juice-bot)" opacity="0.55"/>
    </g>
    <g fill="var(--bubble)">
      <circle class="b"  cx="635" cy="238" r="5"/>
      <circle class="b2" cx="668" cy="240" r="4"/>
      <circle class="b3" cx="690" cy="236" r="6"/>
      <circle class="b4" cx="650" cy="242" r="3"/>
      <circle class="b5" cx="700" cy="240" r="4"/>
    </g>
  </g>

  <!-- verre (contour + reflet) -->
  <path d="M575 80 L745 80 L712 250 L608 250 Z" fill="var(--glass-fill)" fill-opacity="0.10"
        stroke="var(--glass-stroke)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M592 92 L606 232" stroke="var(--bubble)" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <ellipse cx="660" cy="80" rx="85" ry="12" fill="none" stroke="var(--glass-stroke)" stroke-width="5"/>

  <!-- rondelle d'orange -->
  <g transform="translate(744 92)">
    <circle r="27" fill="var(--juice-top)" stroke="var(--accent)" stroke-width="4"/>
    <circle r="20" fill="var(--bubble)" opacity="0.35"/>
    <g stroke="var(--accent)" stroke-width="2" opacity="0.7">
      <line x1="0" y1="0" x2="0" y2="-20"/>
      <line x1="0" y1="0" x2="17" y2="-10"/>
      <line x1="0" y1="0" x2="17" y2="10"/>
      <line x1="0" y1="0" x2="0" y2="20"/>
      <line x1="0" y1="0" x2="-17" y2="10"/>
      <line x1="0" y1="0" x2="-17" y2="-10"/>
    </g>
    <!-- petite feuille -->
    <path d="M22 -24 q14 -10 24 -2 q-12 8 -24 2 Z" fill="var(--leaf)"/>
  </g>
</svg>
