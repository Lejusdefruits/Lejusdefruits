<svg viewBox="0 0 360 392" width="360" height="392" xmlns="http://www.w3.org/2000/svg"
     font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif">
  <rect x="4" y="4" width="352" height="384" rx="14" fill="#FFF8E8" stroke="#3A2410" stroke-width="5"/>

  <text x="24" y="46" font-size="24" font-weight="bold" fill="#3A2410" letter-spacing="0.3">Valeurs Nutritionnelles</text>
  <text x="24" y="70" font-size="14" fill="#6B4A22">Portion : 1 dépôt · pressé à froid</text>

  <rect x="20" y="82" width="320" height="9" fill="#3A2410"/>
  <text x="24" y="112" font-size="14" font-weight="bold" fill="#3A2410">% des apports journaliers du dev*</text>
  <line x1="20" y1="122" x2="340" y2="122" stroke="#3A2410" stroke-width="2"/>

  <g font-size="17" fill="#3A2410">
    <text x="24" y="148" font-weight="bold">Caféine</text>
    <text x="336" y="148" text-anchor="end" font-weight="bold" fill="#FF6B00">200 %</text>
    <line x1="20" y1="158" x2="340" y2="158" stroke="#E2C79A" stroke-width="1"/>

    <text x="24" y="180" font-weight="bold">Curiosité</text>
    <text x="336" y="180" text-anchor="end" font-weight="bold" fill="#FF6B00">150 %</text>
    <line x1="20" y1="190" x2="340" y2="190" stroke="#E2C79A" stroke-width="1"/>

    <text x="24" y="212" font-weight="bold">Vitamine C<tspan font-size="12">(ode)</tspan></text>
    <text x="336" y="212" text-anchor="end" font-weight="bold" fill="#FF6B00">100 %</text>
    <line x1="20" y1="222" x2="340" y2="222" stroke="#E2C79A" stroke-width="1"/>

    <text x="24" y="244" font-weight="bold">Bugs ajoutés</text>
    <text x="336" y="244" text-anchor="end" font-weight="bold" fill="#3FA34D">0 g</text>
    <line x1="20" y1="254" x2="340" y2="254" stroke="#E2C79A" stroke-width="1"/>

    <text x="24" y="276" font-weight="bold">Énergie</text>
    <text x="336" y="276" text-anchor="end" font-weight="bold">9000 kcal</text>
    <line x1="20" y1="286" x2="340" y2="286" stroke="#E2C79A" stroke-width="1"/>

    <text x="24" y="308" font-weight="bold">Sommeil</text>
    <text x="336" y="308" text-anchor="end">traces</text>
  </g>

  <rect x="20" y="320" width="320" height="6" fill="#3A2410"/>
  <text x="24" y="346" font-size="13" fill="#3A2410" font-weight="bold">Commits : à consommer sans modération.</text>
  <text x="24" y="370" font-size="11" fill="#6B4A22">* varie à l'approche des deadlines.</text>
</svg>
