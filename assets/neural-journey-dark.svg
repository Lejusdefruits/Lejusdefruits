<svg viewBox="0 0 900 450" width="900" height="450" xmlns="http://www.w3.org/2000/svg" style="font-family: monospace; cursor: default;">
  <defs>
    <!-- Sketchy Filter -->
    <filter id="sketchy" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <style>
    :root {
      --bg: #0D1117;
      --stroke: #D8DEE9;
      --text: #E5E9F0;
      --path: #4C566A;
      --signal: #A3BE8C;
    }

    .bg-rect { fill: var(--bg); }
    
    .node-box {
      fill: var(--bg);
      stroke: var(--stroke);
      stroke-width: 2;
      filter: url(#sketchy);
    }
    
    .node-text {
      fill: var(--text);
      font-size: 14px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .edge {
      fill: none;
      stroke: var(--path);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
      filter: url(#sketchy);
    }

    .signal {
      fill: var(--signal);
      filter: url(#sketchy);
    }
  </style>
  
  <rect class="bg-rect" width="100%" height="100%" rx="10" />

  <!-- Paths -->
  <!-- Layer 1 to Layer 2 -->
  <path id="p1" d="M 150 150 C 250 150, 300 100, 400 100" class="edge" />
  <path id="p2" d="M 150 150 C 250 150, 300 225, 400 225" class="edge" />
  <path id="p3" d="M 150 300 C 250 300, 300 225, 400 225" class="edge" />
  <path id="p4" d="M 150 300 C 250 300, 300 350, 400 350" class="edge" />

  <!-- Layer 2 to Layer 3 -->
  <path id="p5" d="M 400 100 C 500 100, 550 150, 650 150" class="edge" />
  <path id="p6" d="M 400 225 C 500 225, 550 150, 650 150" class="edge" />
  <path id="p7" d="M 400 225 C 500 225, 550 300, 650 300" class="edge" />
  <path id="p8" d="M 400 350 C 500 350, 550 300, 650 300" class="edge" />

  <!-- Layer 3 to Layer 4 -->
  <path id="p9" d="M 650 150 C 720 150, 750 225, 820 225" class="edge" />
  <path id="p10" d="M 650 300 C 720 300, 750 225, 820 225" class="edge" />

  <!-- Signals (Animated points along paths) -->
  <circle class="signal" r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="5s" repeatCount="indefinite" begin="1s"><mpath href="#p2"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="4.5s" repeatCount="indefinite" begin="0.5s"><mpath href="#p3"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="5.5s" repeatCount="indefinite" begin="2s"><mpath href="#p4"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="3.5s" repeatCount="indefinite" begin="0s"><mpath href="#p5"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="4.2s" repeatCount="indefinite" begin="1.5s"><mpath href="#p6"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="4.8s" repeatCount="indefinite" begin="0.8s"><mpath href="#p7"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="3.9s" repeatCount="indefinite" begin="2.2s"><mpath href="#p8"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#p9"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="3.6s" repeatCount="indefinite" begin="1.2s"><mpath href="#p10"/></animateMotion></circle>

  <!-- Nodes (Layer 1) -->
  <g transform="translate(150, 150)">
    <rect class="node-box" x="-70" y="-20" width="140" height="40" rx="3" />
    <text class="node-text" x="0" y="0">[Foundation]</text>
  </g>
  <g transform="translate(150, 300)">
    <rect class="node-box" x="-70" y="-20" width="140" height="40" rx="3" />
    <text class="node-text" x="0" y="0">[Init Skill]</text>
  </g>

  <!-- Nodes (Layer 2) -->
  <g transform="translate(400, 100)">
    <rect class="node-box" x="-80" y="-20" width="160" height="40" rx="3" />
    <text class="node-text" x="0" y="0">[Experience 1]</text>
  </g>
  <g transform="translate(400, 225)">
    <rect class="node-box" x="-80" y="-20" width="160" height="40" rx="3" />
    <text class="node-text" x="0" y="0">[Core Skillset]</text>
  </g>
  <g transform="translate(400, 350)">
    <rect class="node-box" x="-80" y="-20" width="160" height="40" rx="3" />
    <text class="node-text" x="0" y="0">[Experience 2]</text>
  </g>

  <!-- Nodes (Layer 3) -->
  <g transform="translate(650, 150)">
    <rect class="node-box" x="-70" y="-20" width="140" height="40" rx="3" />
    <text class="node-text" x="0" y="0">[Project Alpha]</text>
  </g>
  <g transform="translate(650, 300)">
    <rect class="node-box" x="-70" y="-20" width="140" height="40" rx="3" />
    <text class="node-text" x="0" y="0">[Project Beta]</text>
  </g>

  <!-- Node (Layer 4) -->
  <g transform="translate(820, 225)">
    <rect class="node-box" x="-60" y="-20" width="120" height="40" rx="3" />
    <text class="node-text" x="0" y="0">[Target Goal]</text>
  </g>
</svg>
