<svg viewBox="0 0 900 450" width="900" height="450" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Courier New', Courier, monospace; cursor: default;">
  <style>
    :root {
      --bg: #0D1117;
      --trace: #30363D;
      --chip-fill: #161B22;
      --chip-stroke: #8B949E;
      --text: #C9D1D9;
      --signal: #58A6FF;
      --pin: #8B949E;
    }

    .bg-rect { fill: var(--bg); }
    
    .trace {
      fill: none;
      stroke: var(--trace);
      stroke-width: 2.5;
      stroke-linejoin: miter;
    }

    .chip {
      fill: var(--chip-fill);
      stroke: var(--chip-stroke);
      stroke-width: 2;
      rx: 2;
    }
    
    .pin {
      fill: var(--bg);
      stroke: var(--pin);
      stroke-width: 2;
    }
    
    .chip-text {
      fill: var(--text);
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .signal {
      fill: var(--signal);
      filter: drop-shadow(0 0 3px var(--signal));
    }
  </style>
  
  <rect class="bg-rect" width="100%" height="100%" rx="10" />

  <!-- Traces (Orthogonal PCB style) -->
  <path id="p1" d="M 150 150 H 250 L 300 100 H 400" class="trace" />
  <path id="p2" d="M 150 150 H 225 L 300 225 H 400" class="trace" />
  <path id="p3" d="M 150 300 H 225 L 300 225 H 400" class="trace" />
  <path id="p4" d="M 150 300 H 250 L 300 350 H 400" class="trace" />

  <path id="p5" d="M 400 100 H 500 L 550 150 H 650" class="trace" />
  <path id="p6" d="M 400 225 H 475 L 550 150 H 650" class="trace" />
  <path id="p7" d="M 400 225 H 475 L 550 300 H 650" class="trace" />
  <path id="p8" d="M 400 350 H 500 L 550 300 H 650" class="trace" />

  <path id="p9" d="M 650 150 H 685 L 760 225 H 820" class="trace" />
  <path id="p10" d="M 650 300 H 685 L 760 225 H 820" class="trace" />

  <!-- Signals (Animated Data Packets) -->
  <circle class="signal" r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="4.8s" repeatCount="indefinite" begin="1s"><mpath href="#p2"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="4.2s" repeatCount="indefinite" begin="0.5s"><mpath href="#p3"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="5.1s" repeatCount="indefinite" begin="2s"><mpath href="#p4"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="3.7s" repeatCount="indefinite" begin="0s"><mpath href="#p5"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="4.5s" repeatCount="indefinite" begin="1.5s"><mpath href="#p6"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="4.1s" repeatCount="indefinite" begin="0.8s"><mpath href="#p7"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="3.8s" repeatCount="indefinite" begin="2.2s"><mpath href="#p8"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#p9"/></animateMotion></circle>
  <circle class="signal" r="4"><animateMotion dur="3.6s" repeatCount="indefinite" begin="1.2s"><mpath href="#p10"/></animateMotion></circle>

  <!-- Chips (Layer 1) -->
  <g transform="translate(150, 150)">
    <rect class="chip" x="-75" y="-20" width="150" height="40" />
    <circle class="pin" cx="-75" cy="0" r="3" />
    <circle class="pin" cx="75" cy="0" r="3" />
    <text class="chip-text" x="0" y="2">[push_swap_algo]</text>
  </g>
  <g transform="translate(150, 300)">
    <rect class="chip" x="-75" y="-20" width="150" height="40" />
    <circle class="pin" cx="-75" cy="0" r="3" />
    <circle class="pin" cx="75" cy="0" r="3" />
    <text class="chip-text" x="0" y="2">[pipex_sys]</text>
  </g>

  <!-- Chips (Layer 2) -->
  <g transform="translate(400, 100)">
    <rect class="chip" x="-85" y="-20" width="170" height="40" />
    <circle class="pin" cx="-85" cy="0" r="3" />
    <circle class="pin" cx="85" cy="0" r="3" />
    <text class="chip-text" x="0" y="2">[Codexion_C]</text>
  </g>
  <g transform="translate(400, 225)">
    <rect class="chip" x="-85" y="-20" width="170" height="40" />
    <circle class="pin" cx="-85" cy="0" r="3" />
    <circle class="pin" cx="85" cy="0" r="3" />
    <text class="chip-text" x="0" y="2">[fly-in_route]</text>
  </g>
  <g transform="translate(400, 350)">
    <rect class="chip" x="-85" y="-20" width="170" height="40" />
    <circle class="pin" cx="-85" cy="0" r="3" />
    <circle class="pin" cx="85" cy="0" r="3" />
    <text class="chip-text" x="0" y="2">[42-PacMan]</text>
  </g>

  <!-- Chips (Layer 3) -->
  <g transform="translate(650, 150)">
    <rect class="chip" x="-75" y="-20" width="150" height="40" />
    <circle class="pin" cx="-75" cy="0" r="3" />
    <circle class="pin" cx="75" cy="0" r="3" />
    <text class="chip-text" x="0" y="2">[call_me_maybe]</text>
  </g>
  <g transform="translate(650, 300)">
    <rect class="chip" x="-75" y="-20" width="150" height="40" />
    <circle class="pin" cx="-75" cy="0" r="3" />
    <circle class="pin" cx="75" cy="0" r="3" />
    <text class="chip-text" x="0" y="2">[R.A.G_pipeline]</text>
  </g>

  <!-- Chip (Layer 4) -->
  <g transform="translate(820, 225)">
    <rect class="chip" x="-65" y="-20" width="130" height="40" />
    <circle class="pin" cx="-65" cy="0" r="3" />
    <circle class="pin" cx="65" cy="0" r="3" />
    <text class="chip-text" x="0" y="2">[NotLongGraph]</text>
  </g>
</svg>
