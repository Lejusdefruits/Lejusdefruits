<svg viewBox="0 0 850 400" width="850" height="400" xmlns="http://www.w3.org/2000/svg" style="font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; cursor: default;">
  <style>
    :root {
      --bg: #0D1117;
      --fg: #C9D1D9;
      --border: #30363D;
      --hl: #161B22;
      --keyword: #79C0FF;
      --string: #A5D6FF;
      --comment: #8B949E;
      --status-bg: #1F6FEB;
      --status-fg: #FFFFFF;
      --number: #484F58;
    }
    
    .pane { fill: var(--bg); }
    .border { stroke: var(--border); stroke-width: 2; }
    
    .tab-trigger { fill: transparent; cursor: pointer; }
    
    .tree-text {
      fill: var(--fg);
      font-size: 13px;
      pointer-events: none;
      transition: fill 0.2s;
    }
    
    .tree-icon { fill: var(--comment); pointer-events: none; }
    
    .tab-trigger:hover .tree-text { fill: var(--keyword); font-weight: bold; }
    .tab-trigger:hover .tree-icon { fill: var(--keyword); }
    
    .content { opacity: 0; transition: opacity 0.2s; }
    #content-profile { opacity: 1; }

    /* CSS Hover Hack */
    #tab-projects:hover ~ #content-profile,
    #tab-contact:hover ~ #content-profile { opacity: 0; }
    #tab-projects:hover ~ #content-projects { opacity: 1; }
    #tab-contact:hover ~ #content-contact { opacity: 1; }

    .code { fill: var(--fg); font-size: 14px; }
    .kw { fill: var(--keyword); font-weight: bold; }
    .str { fill: var(--string); }
    .com { fill: var(--comment); font-style: italic; }
    .num { fill: var(--number); font-size: 14px; text-anchor: end; user-select: none; }
    
    /* Line Highlight Animation */
    .line-hl { fill: var(--hl); opacity: 0.8; }
  </style>

  <!-- Background -->
  <rect class="pane" width="100%" height="100%" />

  <!-- Borders (Tmux / Nvim splits) -->
  <line x1="220" y1="0" x2="220" y2="375" class="border" />
  
  <!-- Status Bar -->
  <rect x="0" y="375" width="850" height="25" fill="var(--status-bg)" />
  <text x="15" y="392" fill="var(--status-fg)" font-size="13" font-weight="bold"> NORMAL </text>
  <text x="80" y="392" fill="var(--status-fg)" font-size="13"> src/main.rs </text>
  <text x="750" y="392" fill="var(--status-fg)" font-size="13"> utf-8  [+]  100% </text>

  <!-- Nvim Tree (Sidebar) Header -->
  <text x="15" y="25" fill="var(--comment)" font-size="12" font-weight="bold" letter-spacing="1">EXPLORER</text>
  <text x="10" y="50" class="tree-icon" font-size="12">▼</text>
  <text x="25" y="50" fill="var(--fg)" font-size="13" font-weight="bold">Lejusdefruits</text>

  <!-- TABS (Triggers) -->
  <g id="tab-projects" class="tab-trigger">
    <rect x="0" y="90" width="220" height="25" />
    <text class="tree-icon" x="30" y="107" font-size="13">📄</text>
    <text class="tree-text" x="50" y="107">projects.sh</text>
  </g>

  <g id="tab-contact" class="tab-trigger">
    <rect x="0" y="115" width="220" height="25" />
    <text class="tree-icon" x="30" y="132" font-size="13">📄</text>
    <text class="tree-text" x="50" y="132">contact.json</text>
  </g>

  <g id="tab-profile" class="tab-trigger">
    <rect x="0" y="65" width="220" height="25" />
    <!-- Default highlighted tab background -->
    <rect x="0" y="65" width="220" height="25" class="line-hl" />
    <text class="tree-icon" x="30" y="82" font-size="13">📄</text>
    <text class="tree-text" x="50" y="82" font-weight="bold">profile.yaml</text>
  </g>

  <!-- CONTENT BLOCKS -->

  <!-- Content: Profile -->
  <g id="content-profile" class="content">
    <rect x="220" y="60" width="630" height="20" class="line-hl" /> <!-- Active line highlight -->
    
    <!-- Line numbers -->
    <text class="num" x="250" y="30">1</text>
    <text class="num" x="250" y="50">2</text>
    <text class="num" x="250" y="70">3</text>
    <text class="num" x="250" y="90">4</text>
    <text class="num" x="250" y="110">5</text>
    <text class="num" x="250" y="130">6</text>
    <text class="num" x="250" y="150">7</text>
    <text class="num" x="250" y="170">8</text>

    <!-- Code -->
    <text class="code" x="270" y="30"><tspan class="com"># IDENTITY CONFIGURATION</tspan></text>
    <text class="code" x="270" y="50">---</text>
    <text class="code" x="270" y="70"><tspan class="kw">role:</tspan> <tspan class="str">"Software Engineer"</tspan></text>
    <text class="code" x="270" y="90"><tspan class="kw">specialty:</tspan> <tspan class="str">"Backend Systems, Low-level Architecture"</tspan></text>
    <text class="code" x="270" y="110"><tspan class="kw">focus:</tspan> <tspan class="str">"Building scalable &amp; resilient infrastructure"</tspan></text>
    <text class="code" x="270" y="130"><tspan class="kw">location:</tspan> <tspan class="str">"Paris, France"</tspan></text>
    <text class="code" x="270" y="170"><tspan class="com">&gt; Hover over files in the explorer to navigate</tspan></text>
  </g>

  <!-- Content: Projects -->
  <g id="content-projects" class="content">
    <rect x="220" y="80" width="630" height="20" class="line-hl" />
    
    <text class="num" x="250" y="30">1</text>
    <text class="num" x="250" y="50">2</text>
    <text class="num" x="250" y="70">3</text>
    <text class="num" x="250" y="90">4</text>
    <text class="num" x="250" y="110">5</text>
    <text class="num" x="250" y="130">6</text>
    <text class="num" x="250" y="150">7</text>
    
    <text class="code" x="270" y="30"><tspan class="kw">#!/usr/bin/env bash</tspan></text>
    <text class="code" x="270" y="50"><tspan class="com"># Deploying impact...</tspan></text>
    <text class="code" x="270" y="90"><tspan class="kw">echo</tspan> <tspan class="str">"[Project Alpha Name]"</tspan></text>
    <text class="code" x="290" y="110"><tspan class="com"># High-impact backend service handling 10k req/sec.</tspan></text>
    
    <text class="code" x="270" y="150"><tspan class="kw">echo</tspan> <tspan class="str">"[Project Beta Name]"</tspan></text>
    <text class="code" x="290" y="170"><tspan class="com"># Open-source framework for distributed data orchestration.</tspan></text>
  </g>

  <!-- Content: Contact -->
  <g id="content-contact" class="content">
    <rect x="220" y="60" width="630" height="20" class="line-hl" />
    
    <text class="num" x="250" y="30">1</text>
    <text class="num" x="250" y="50">2</text>
    <text class="num" x="250" y="70">3</text>
    <text class="num" x="250" y="90">4</text>
    <text class="num" x="250" y="110">5</text>

    <text class="code" x="270" y="30">{</text>
    <text class="code" x="290" y="50"><tspan class="kw">"email"</tspan>: <tspan class="str">"contact@example.com"</tspan>,</text>
    <text class="code" x="290" y="70"><tspan class="kw">"github"</tspan>: <tspan class="str">"github.com/Lejusdefruits"</tspan>,</text>
    <text class="code" x="290" y="90"><tspan class="kw">"twitter"</tspan>: <tspan class="str">"@Lejusdefruits"</tspan></text>
    <text class="code" x="270" y="110">}</text>
  </g>
</svg>
