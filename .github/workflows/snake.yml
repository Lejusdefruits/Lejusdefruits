name: 🐍 Génère le serpent

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 h
  workflow_dispatch:          # bouton "Run workflow" manuel
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Générer les SVG du serpent
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF6B00&color_dots=#FFF3D6,#FFD98C,#FF8C1A,#FF6B00,#E8590C
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8C1A&color_dots=#2E1C08,#7A3E00,#E8590C,#FF8C1A,#FFB347

      - name: Publier dans output/snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          destination_dir: snake
          keep_files: true
